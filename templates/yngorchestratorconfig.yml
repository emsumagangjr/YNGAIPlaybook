# YNG Orchestrator config. From YNGAIPlaybook (guides/epic-workflow.md, section 25).
#
# This file tells the orchestrator (/yngorchestrator, the agent that runs a
# feature's work for you) which decisions it may take on its own and which
# stay with you. Each setting below says what it decides, the values it
# takes, its default, when it is read, and who changes it.
#
# Where it lives: .yngaiplaybook/yngorchestratorconfig.yml in your project
#   root, the folder holding .bare/, outside every worktree.
# Never committed: it belongs to no branch, so no branch or pull request can
#   change it, and no agent's work can grant itself a setting. Only you edit
#   it, by hand.
# Written by yngorch: whole, from this template, only when the file is
#   absent. On a reinstall it keeps the file and adds only what this
#   template has and the file lacks: each missing setting, with its
#   comments, just above the worked examples, and each missing key under
#   a setting active in your file (such as a new merge path). It never
#   changes, removes or reorders a line of yours. Before adding anything
#   it copies the file to yngorchestratorconfig.yml.bak beside it,
#   replacing an older backup, and prints one line per backup and per
#   addition. With nothing to add it writes no backup and prints "kept".
#   A setting whose header you kept, with its key commented out, stays as
#   you left it. A setting you deleted, header and key, comes back at its
#   default. A key of yours this template does not have is left as it is,
#   with a note that the orchestrator ignores it. The other writes fill
#   in the provider and host settings when they have no value, and an
#   empty issues setting when you pass -IssuesRepo (see below).
# Read fresh: the orchestrator reads the file as it is now, at the start of
#   every run and again before every merge. An edit counts from the next
#   read; there is nothing to restart.
# A missing file means every default below.
#
# Words used below:
#   Epic    one feature: a parent issue, built on its own branch
#           (epic/<n>-<name>) out of smaller issues called slices.
#   slice   one piece of an Epic, built on its own branch (slice/<n>-<name>)
#           and merged into the Epic branch through a pull request.
#   plan    the table of slices the orchestrator proposes for an Epic; you
#           approve it before any slice is created.
#   Gate 1  the decision that an issue is ready for an agent to start. Its
#           mark is the label workflow:ready-for-agent ("Agent-Ready").
#   Gate 2  the decision to merge a pull request.
#   Run board
#           what a run writes as it goes: one HTML file per Epic,
#           showing every slice of it, where each one has got to, and
#           which of them need you. See run-board below.


# --- Setting: provider -------------------------------------------------------
# Decides: which git provider holds this project's repository, and so
#   which tool the orchestrator works through. Not a gate: it says where
#   things are.
# Values:
#   github     GitHub (github.com or GitHub Enterprise Server), through gh.
#   gitlab     GitLab (gitlab.com or self-managed), through glab.
#   bitbucket  Bitbucket Cloud (bitbucket.org), through its REST API with
#              curl, BITBUCKET_EMAIL and BITBUCKET_API_TOKEN. The token
#              lives in your environment only, never in this file.
# Default: github. An absent key or an empty value means github, so a
#   config written before this setting works as before. Any other value
#   stops the run before it touches anything, naming the value and these
#   three; yngorch stops too.
# Read: at the start of every run.
# Changed by: you. yngorch writes the key, just below the commented-out
#   line, only when it has no value yet, and never overwrites a value: it
#   detects the provider from origin's host (github.com, gitlab.com and
#   bitbucket.org by name; any other host by which of gh and glab is
#   logged in to it), or takes it from yngorch -Provider (--provider in
#   yngorch.sh) when detection cannot tell. A -Provider that differs from
#   your value is a warning; your value is kept.
# provider: github | gitlab | bitbucket


# --- Setting: host -----------------------------------------------------------
# Decides: the provider's host name, for example github.example.com for
#   GitHub Enterprise Server or gitlab.example.com for GitLab
#   self-managed. Not a gate.
# Values:
#   <host>     the host origin's repository lives on, without https://.
#              Bitbucket takes only bitbucket.org: Bitbucket Data Center
#              is planned, not supported, and yngorch stops on it.
#   (no value) the provider's cloud host: github.com, gitlab.com or
#              bitbucket.org. (default)
# Default: no value, the provider's cloud host.
# Read: at the start of every run.
# Changed by: you. yngorch writes the key, just below the commented-out
#   line, only when it has no value yet, from origin's URL (else the
#   provider's cloud host), and never overwrites a value.
# host: <host>


# --- Setting: issues ---------------------------------------------------------
# Decides: which GitHub repository holds this project's issues. Not a gate:
#   it says where things are. The orchestrator reads, labels, comments on
#   and creates issues there. Code, branches and pull requests always stay
#   in origin's repository.
# Values:
#   <owner>/<repo>  the issues live in that GitHub repository, for example
#                   acme/app-issues. Set it when you keep issues apart from
#                   the code.
#   (no value)      the issues live in origin's repository, beside the
#                   code. (default)
# Default: no value. An absent key, an empty value, or origin's own
#   repository all mean the default. Any other value that is not
#   <owner>/<repo> stops the run before it touches anything, naming the
#   value; yngorch then skips creating labels, with a warning.
# Read: at the start of every run.
# Changed by: you. yngorch adds this setting, commented out as below,
#   when it is missing, and never changes it otherwise; yngorch
#   -IssuesRepo <owner>/<repo> (--issues-repo in yngorch.sh) writes the
#   key only when it has no value yet, and never overwrites a value.
# issues: <owner>/<repo>


# --- Setting: auto-promote ---------------------------------------------------
# Decides: Gate 1 in advance, for the slices the orchestrator plans for an
#   Epic. "Promote" means label a slice workflow:ready-for-agent, so an
#   agent may start it.
# Values:
#   no   you promote each slice yourself. (default)
#   yes  your approval of the plan promotes the slices it routes to an
#        agent. true works too; capitals do not matter.
# Default: no. An absent key, or any value other than yes or true, means
#   no: a project without this key works as before.
# Never promoted, whatever it says: a slice only a person may do (it is
#   labelled workflow:ready-for-human instead), a standalone issue, and a
#   slice created by hand. Those reach an agent only through your label.
# Switching back to no: slices promoted under yes stop counting as
#   promoted, and wait for your label.
# Read: at the start of every run.
# Changed by: you. yngorch adds the key, at no, when it is missing, and
#   never changes it.
#
# Promote approved slices to Agent-Ready automatically.
#   no   You promote each slice (label workflow:ready-for-agent)
#        before an agent may start it. (default)
#   yes  Approving the Epic's plan promotes its agent slices, and
#        work starts at once. The run still stops whenever your
#        attention is required: approving the plan, slices only a
#        person may do, open review decisions, merges you keep, and
#        repeated failures.
auto-promote: no


# --- Setting: merge (one key per kind of pull request) -----------------------
# Decides: Gate 2 in advance: who merges each kind of pull request.
#   slice-to-epic  a slice's pull request (slice/*) into its Epic branch
#   epic-to-main   an Epic's pull request (epic/*) into main, which
#                  delivers the whole feature
#   fix-to-main    a standalone fix's pull request (fix/*) into main; a
#                  standalone fix is an issue worked alone, with no Epic
# Values, the same for each key:
#   required  you merge the pull request yourself. (default)
#   auto      the orchestrator merges it, but only when all of these hold:
#             the agent reported the work done (for epic-to-main: every
#             slice issue of the Epic is closed); the pull request is open,
#             mergeable, and goes from the expected branch into the
#             expected one; every check passed; and its review record holds
#             no open decision for you. If any does not hold, the pull
#             request stays with you, with a comment naming why. It merges
#             with a merge commit and deletes the merged branch.
# Default: required. A missing file, a missing key, or any value other
#   than auto means required.
# Read: before every merge, for the key that merge falls under.
# Changed by: you. yngorch adds merge, or any one of its keys, at
#   required, when it is missing, and never changes them. A key it cannot
#   add line by line (merge written on one line as {...}, set twice, or
#   its keys indented with a tab or unevenly) it reports as a warning,
#   with the line to paste by hand.
merge:
  slice-to-epic: required   # required | auto
  epic-to-main: required    # required | auto
  fix-to-main: required     # required | auto


# --- Setting: launcher -------------------------------------------------------
# Decides: where a run opens its own agent instance. Every Epic, slice and
#   standalone run works in its issue's own worktree; started anywhere
#   else, /yngorchestrator opens a new instance there with the command
#   already sent, and the session you started it from ends. Not a gate.
# Values:
#   herdr-app  a new space in the Herdr desktop app, named after the
#              project and worktree ("YNGAIPlaybook · epic98-yngproviders").
#   herdr      a new workspace in the herdr CLI (its terminal UI), named
#              the same way.
#              Both are optional, and separate products: https://herdr.dev
#   terminal   a new terminal window: Windows Terminal, Terminal.app, or
#              $TERMINAL on other systems.
#   (no value) the Herdr app when its window is open, else the herdr CLI
#              when its server is running, else a terminal window. (default)
# Default: no value. An absent key, an empty value or any other value
#   means the default, and never stops a run.
# Read: at the start of every run.
# Changed by: you. yngorch writes the key only while it has no value:
#   from -Launcher / --launcher, or else by asking you, when it finds
#   herdr or the Herdr app and runs in a terminal it can ask in. It never
#   changes a value you set, and adds this setting when it is missing.
# launcher: herdr-app | herdr | terminal


# --- Setting: remote-control -------------------------------------------------
# Decides: whether the agent instance a run opens (see launcher) starts
#   with Claude Code's Remote Control on, so you can follow and answer it
#   from claude.ai or the Claude app on your phone. Its remote session
#   carries the instance's name. Not a gate.
# Values:
#   yes  every launched instance starts with Remote Control. true works
#        too; capitals do not matter. (default)
#   no   launched instances start without it. false works too.
# Default: yes. An absent key, an empty value or any value other than no
#   or false means yes, and never stops a run. A session you start
#   yourself, and a run that goes on in it, is not changed.
# Read: at the start of every run.
# Changed by: you. yngorch never writes the key; it adds this setting
#   when it is missing.
remote-control: yes


# --- Setting: run-board ------------------------------------------------------
# Decides: whether a run writes its run board as it goes, and whether it
#   opens that board in your browser. Not a gate: the board only shows
#   where the run has got to. It never changes an issue, a label or a
#   pull request, and the list the run tells you at the end is the same
#   whatever you set here.
# Values:
#   write  the run writes the board at every run-log event and opens
#          nothing. Open it when you want it: leave a tab on it and
#          reload, or type yngboard. (default)
#   open   the run writes the same board, and opens it in your default
#          browser once, at that run's first write.
#   no     the run writes no board at all.
# Default: write, not open. The board is now written from the start of a
#   run rather than at its end, so open raises a browser window near the
#   start of every run, including a run that turns out to have nothing
#   to do. An absent key, an empty value or any value other than open or
#   no means write, and never stops a run.
# Read: at the start of every run, and held until that run ends.
# Changed by: you. yngorch never writes the key; it adds this setting,
#   at write, only when your file has neither run-board nor
#   handback-page, its former name.
run-board: write


# --- Setting: handback-page --------------------------------------------------
# Former name: handback-page is what run-board was called in 1.15.0, when
#   the file was written once, at the end of a run, and showed only what
#   was waiting on you. A config that still carries the key is honoured
#   as it is: with no run-board key beside it, its value is read in
#   run-board's place, and nothing ever rewrites it. Set both, and
#   run-board wins.
# Decides: what run-board decides, when and only when your file has no
#   run-board key. See run-board above.
# Values: open, write and no, each read as run-board reads it, so a key
#   you set to write or no in 1.15.0 goes on meaning what it meant.
# Default: run-board's, write: an absent key, an empty value or any value
#   other than open or no is read as write, and never stops a run.
# Read: at the start of every run, and held until that run ends.
# Changed by: you. yngorch never writes the key; it adds this setting,
#   commented out as below, when it is missing.
# handback-page: open


# --- Setting: agent ----------------------------------------------------------
# Decides: which agent the run's own instance starts. Not a gate.
# Values:
#   claude  Claude Code. (default, and the only agent today)
# Default: claude. An absent key or an empty value means claude. Any other
#   value stops the run before it touches anything, until other agents
#   are added (https://github.com/emsumagangjr/YNGAIPlaybook/issues/61).
# Read: at the start of every run.
# Changed by: you. yngorch never writes the key; it adds this setting,
#   commented out as below, when it is missing.
# agent: claude


# =============================================================================
# Worked examples. Commented out: the orchestrator reads only the settings
# above. To use one, change the settings above to match; uncommenting these
# lines would set the same keys twice.
#
# Example 1, the default: every gate stays with you.
#
#   auto-promote: no
#   merge:
#     slice-to-epic: required
#     epic-to-main: required
#     fix-to-main: required
#
#   The run stops for you to:
#   - approve the Epic's plan;
#   - promote each slice (label workflow:ready-for-agent) before an agent
#     starts it, then run the orchestrator again;
#   - do the slices only a person may do;
#   - answer open decisions in a pull request's review record;
#   - merge every pull request;
#   - take over a slice that failed twice.
#
# Example 2, hands-off: approving the plan carries the Epic to its last
# merge.
#
#   auto-promote: yes
#   merge:
#     slice-to-epic: auto
#     epic-to-main: required
#     fix-to-main: required
#
#   The run still stops for you to:
#   - approve the Epic's plan: that approval promotes its agent slices,
#     and work starts at once;
#   - do the slices only a person may do (slices that depend on them wait);
#   - answer open decisions in a pull request's review record: such a pull
#     request is not merged;
#   - merge a slice's pull request that fails a merge condition (a failed
#     check, a conflict);
#   - merge the Epic into main: epic-to-main stays required;
#   - take over a slice that failed twice.
